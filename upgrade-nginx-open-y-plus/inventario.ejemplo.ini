# Resolver estos nombres por DNS o agregar ansible_host=IP_REAL.
# SSH, become y el interprete de los modulos Ansible se definen en tu framework.
[nginx_upgrade]
LNK5141 version=NginxPlus server=LNK5141 nginx_python=/usr/libexec/platform-python
LNK9375 version=NginxOpen server=LNK9375 nginx_python=/usr/bin/python3
LNK4989 version=NginxOpen server=LNK4989 nginx_python=/usr/libexec/platform-python

